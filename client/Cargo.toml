[package]
name = "oxish-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "SSH client on the vendored OxiSH protocol code and Graviola"
license = "Apache-2.0 OR MIT"

[dependencies]
data-encoding = "2.10"
graviola = "0.4"
libc = "0.2"
oxish-graviola = { path = "../vendor/oxish/oxish-graviola" }
oxish-proto = { path = "../vendor/oxish/oxish-proto" }
rustix = { version = "1.1.4", features = ["event", "fs", "net", "pipe", "process", "termios", "time"] }
zeroize = "1"

[dev-dependencies]
rustix = { version = "1.1.4", features = ["fs", "process", "pty", "termios"] }
sha2 = "0.11"
tempfile = "3"

[patch.crates-io]
graviola = { path = "../vendor/graviola" }

[workspace]
