name: fuzz

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Vendored sources match their pins and patches
        run: |
          sh scripts/vendor-oxish.sh verify
          sh scripts/vendor-graviola.sh verify
      - name: Graviola is the only crypto provider
        run: sh scripts/check-crypto-graph.sh
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked --quiet
      - name: Fuzz targets
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/.work/target-fuzz
        run: |
          for target in decode authorized_key git_command ssh_chacha_open ssh_chacha_roundtrip channel_state; do
            cargo fuzz run "$target" --fuzz-dir vendor/oxish/fuzz -- -max_total_time=60 -print_final_stats=1
          done
