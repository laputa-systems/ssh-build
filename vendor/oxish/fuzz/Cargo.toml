[package]
name = "oxish-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.proto]
package = "oxish-proto"
path = "../oxish-proto"

[dependencies.provider]
package = "oxish-graviola"
path = "../oxish-graviola"

[dependencies.oxish]
path = "../oxish"

[patch.crates-io]
graviola = { path = "../../graviola" }

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ssh_chacha_open"
path = "fuzz_targets/ssh_chacha_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ssh_chacha_roundtrip"
path = "fuzz_targets/ssh_chacha_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "authorized_key"
path = "fuzz_targets/authorized_key.rs"
test = false
doc = false
bench = false

[[bin]]
name = "git_command"
path = "fuzz_targets/git_command.rs"
test = false
doc = false
bench = false

[[bin]]
name = "channel_state"
path = "fuzz_targets/channel_state.rs"
test = false
doc = false
bench = false
